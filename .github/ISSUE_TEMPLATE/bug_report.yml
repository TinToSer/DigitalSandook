name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problem? Please **don't** file it here - see SECURITY.md."
  - type: input
    id: version
    attributes: { label: Version, description: "Output of `DigitalSanDook version`" }
    validations: { required: true }
  - type: input
    id: os
    attributes: { label: OS / architecture and browser }
  - type: textarea
    id: what
    attributes: { label: "What happened, and what did you expect?" }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove passwords, tokens, hostnames and paths you don't want public.
      render: text
